<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блочная модель (Box Model)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p>Этот параграф демонстрирует работу внешних отступов (margin). Рамка синяя, а отступы заданы по кругу.</p>
 
    <div class="card-container">
        <div class="borderclass">
            <img class="imgclass" src="apple.png" alt="Яблоко" width="50">
            <span>Яблоко</span>
        </div>
        <div class="borderclass">
            <img class="imgclass" src="meat.png" alt="Мясо" width="50">
            <span>Мясо</span>
        </div>
        <div class="borderclass">
            <img class="imgclass" src="cheese.png" alt="Сыр" width="50">
            <span>Сыр</span>
        </div>
        <div class="borderclass">
            <img class="imgclass" src="egg.png" alt="Яйцо" width="50">
            <span>Яйцо</span>
        </div>
        <div class="borderclass">
            <img class="imgclass" src="fish.png" alt="Рыба" width="50">
            <span>Рыба</span>
        </div>
        <div class="borderclass">
            <img class="imgclass" src="garlic.png" alt="Чеснок" width="50">
            <span>Чеснок</span>
        </div>
        <div class="borderclass">
            <img class="imgclass" src="mushroom.png" alt="Гриб" width="50">
            <span>Гриб</span>
        </div>
        <div class="borderclass">
            <img class="imgclass" src="pepper.png" alt="Перец" width="50">
            <span>Перец</span>
        </div>
    </div>

</html>
